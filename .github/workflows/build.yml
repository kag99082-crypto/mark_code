name: Build CodeVault APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # اجرای دستی از تب Actions

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # یا channel: stable
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧹 Analyze code (اختیاری، هشدار می‌ده نه خطا)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 🧪 Run tests (اختیاری)
        run: flutter test
        continue-on-error: true

      - name: 🔨 Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: 🔨 Build universal APK
        run: flutter build apk --release

      - name: 📊 Show APK info
        run: |
          echo "=== APK Files ==="
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: 📤 Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeVault-APK-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔨 Build release APK
        run: flutter build apk --release

      - name: 🚀 Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: CodeVault ${{ github.ref_name }}
          body: |
            ## 🚀 CodeVault ${{ github.ref_name }}

            Offline code file manager for Android.

            ### 📦 What's included
            - Universal APK (all architectures)

            ### 📲 Install
            1. Download `app-release.apk` below
            2. Enable "Install from unknown sources"
            3. Install and enjoy!
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
