name: code_vault
description: Offline code file manager for Android — import, organize, and analyze any file.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File picking & storage
  file_picker: ^8.0.5
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  uuid: ^4.4.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
